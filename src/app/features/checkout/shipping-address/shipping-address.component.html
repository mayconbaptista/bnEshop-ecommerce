
<form action="" [formGroup]="this._formShippingAddress()">
    <div class="d-flex d-flex-row align-items-center justify-content-center">
        <div>
            <mat-form-field class="campo-transparente py-2 px-4" hintLabel="Max 10 characters" appearance="fill">
                <mat-label>Nome</mat-label>
                <input matInput maxlength="20" placeholder="Ex. fulano de tal" formControlName="nome" />
                @if (this._formShippingAddress().controls.nome.invalid) {
                    <mat-hint align="end">/10</mat-hint>
                }
            </mat-form-field>

            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Rua</mat-label>
                <input matInput maxlength="20" placeholder="Ex. av. Brasil" formControlName="rua" />
                @if (this._formShippingAddress().controls.rua.invalid) {
                    <mat-hint align="end">Here's the dropdown arrow ^</mat-hint>
                }
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>CEP</mat-label>
                <input matInput minlength="8" maxlength="9" minlength="8" placeholder="00000-000" formControlName="cep" />
                <mat-hint align="end"></mat-hint>
            </mat-form-field>

            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Cidade</mat-label>
                <input matInput maxlength="100" formControlName="cidade" >
                <mat-hint></mat-hint>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Estado</mat-label>
                <input matInput type="text" minlength="2" maxlength="2" formControlName="estado">
                <mat-hint></mat-hint>
            </mat-form-field>
            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Bairro</mat-label>
                <input matInput type="text" minlength="2" maxlength="100" formControlName="bairro">
                <mat-hint></mat-hint>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Email</mat-label>
                <input matInput type="email" minlength="2" maxlength="100" formControlName="email">
                <mat-hint></mat-hint>
            </mat-form-field>
            <mat-form-field class="campo-transparente px-4 py-2">
                <mat-label>Telefone</mat-label>
                <input matInput type="tel" minlength="2" maxlength="15" placeholder="(34) 00000-0000" formControlName="telefone">
                <mat-hint></mat-hint>
            </mat-form-field>
        </div>
    </div>
</form>
