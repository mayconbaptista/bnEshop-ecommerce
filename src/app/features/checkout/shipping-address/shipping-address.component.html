<h1>Shipping Address</h1>

<form action="" [formGroup]="this._formShippingAddress()">
    <div>
        <div>
            <mat-form-field hintLabel="Max 10 characters">
                <mat-label>Nome</mat-label>
                <input matInput maxlength="20" placeholder="Ex. Nougat" formControlName="nome" />
                <mat-hint align="end">/10</mat-hint>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Rua</mat-label>
                <input matInput maxlength="20" placeholder="Ex. Nougat" formControlName="rua" />
                <mat-hint align="end">Here's the dropdown arrow ^</mat-hint>
            </mat-form-field>
        </div>
        <div>

        </div>
    </div>
    <div>

    </div>
</form>

<div>
    <button matButton matStepperNext>Next</button>
</div>
